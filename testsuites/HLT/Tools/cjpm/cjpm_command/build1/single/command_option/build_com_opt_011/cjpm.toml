[dependencies]

[package]
  cjc-version = "0.26.1"
  compile-option = ""
  description = "nothing here"
  link-option = ""
  name = "test"
  output-type = "executable"
  src-dir = "src"
  target-dir = ""
  version = "1.0.0"
  package-configuration = {}

[target]
[target.x86_64-unknown-linux-gnu]
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = []
  package-option = {"" = "pp/pro1/xoo.cjo"}
[target.aarch64-unknown-linux-gnu]
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = []
  package-option = {"" = "pp/pro1/xoo.cjo"}
[target.cjvm]
[target.cjvm.bin-dependencies]
  path-option = []
  package-option = {"" = "pp/pro1/xoo.cjo"}
[target.x86_64-w64-mingw32]
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = []
  package-option = {"" = "pp/pro1/xoo.cjo"}
[target.x86_64-apple-darwin]
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = []
  package-option = {"" = "pp/pro1/xoo.cjo"}
[target.aarch64-apple-darwin]
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = []
  package-option = {"" = "pp/pro1/xoo.cjo"}
[target.aarch64-linux-ohos]
[target.aarch64-linux-ohos.bin-dependencies]
  path-option = []
  package-option = {"" = "pp/pro1/xoo.cjo"}
  aarch64-hm-gnu = {compile-option = "-B/opt/RTOS_V2X/301.1.0/arm64le_hm_pro/bin -B/opt/RTOS_V2X/301.1.0/arm64le_hm_pro/sdk/usr/lib -L/opt/RTOS_V2X/301.1.0/arm64le_hm_pro/gnu64/aarch64-hongmeng-musl/lib64"}
[target.x86_64-linux-ohos]
  compile-option = "-B=${OHOS_ROOT}/llvm/prebuilt/x86_64-linux-ohos/bin --sysroot=${OHOS_ROOT}/llvm/prebuilt/x86_64-linux-ohos/sysroot"
[target.aarch64-linux-android26]
  compile-option = "-B=${NDK_ROOT}/bin --sysroot=${NDK_ROOT}/sysroot"
[target.aarch64-linux-android31]
  compile-option = "-B=${NDK_ROOT}/bin --sysroot=${NDK_ROOT}/sysroot"
[target.aarch64-linux-android32]
  compile-option = "-B=${NDK_ROOT}/bin --sysroot=${NDK_ROOT}/sysroot"
[target.aarch64-linux-android35]
  compile-option = "-B=${NDK_ROOT}/bin --sysroot=${NDK_ROOT}/sysroot"
[target.arm-linux-android23]
  compile-option = "-B=${NDK_ROOT}/bin --sysroot=${NDK_ROOT}/sysroot"
[target.aarch64-linux-android23]
  compile-option = "-B=${NDK_ROOT}/bin --sysroot=${NDK_ROOT}/sysroot"
[target.arm64-apple-ios-simulator]
  compile-option = "-B/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/ --sysroot=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk"
[target.x86_64-apple-ios-simulator]
  compile-option = "-B/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/ --sysroot=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk"
